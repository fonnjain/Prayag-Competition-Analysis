openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Prayag Polymers pricing-intelligence API (product catalog, MRP history, competition analysis)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Competition analysis dashboard (live-computed, basis-normalized)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/products:
    get:
      operationId: getCatalogProducts
      tags: [catalog]
      summary: List catalog products with current MRP
      parameters:
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: priceStatus
          in: query
          required: false
          description: Filter by price presence. "priced" or "pending".
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductList"
  /catalog/products/{itemCode}:
    get:
      operationId: getCatalogProduct
      tags: [catalog]
      summary: Get a product with its full MRP price history
      parameters:
        - name: itemCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/filters:
    get:
      operationId: getCatalogFilters
      tags: [catalog]
      summary: Available divisions and categories for filtering
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFilters"
  /catalog/data-health:
    get:
      operationId: getCatalogDataHealth
      tags: [catalog]
      summary: Data health report (conflicts, missing prices, duplicate sources)
      responses:
        "200":
          description: Data health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDataHealth"
  /catalog/reset:
    post:
      operationId: resetCatalog
      tags: [catalog]
      summary: Reset the product catalog to the original clean import
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /catalog/comparison:
    get:
      operationId: getComparison
      tags: [comparison]
      summary: Competitor price points joined to Prayag's current MRP with live diff%
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: matchStatus
          in: query
          required: false
          schema:
            type: string
        - name: confidence
          in: query
          required: false
          description: Filter by match confidence tier (High, Medium, Low).
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only rows where Prayag is more expensive than the competitor.
          schema:
            type: boolean
        - name: ambiguousOnly
          in: query
          required: false
          description: Only rows whose unit basis is ambiguous (flagged for review).
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonList"
  /catalog/comparison/summary:
    get:
      operationId: getComparisonSummary
      tags: [comparison]
      summary: Competitive-share KPI and per-category Prayag win-rate
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Comparison summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonSummary"
  /catalog/comparison/by-product:
    get:
      operationId: getComparisonByProduct
      tags: [comparison]
      summary: Per-Prayag-SKU side-by-side comparison across all competitor brands
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only SKUs where Prayag is pricier than the cheapest rival.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Per-product comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductComparisonList"
  /catalog/comparison/filters:
    get:
      operationId: getComparisonFilters
      tags: [comparison]
      summary: Available competitors, categories, and match statuses for filtering
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonFilters"
  /catalog/comparison/matrix:
    get:
      operationId: getComparisonMatrix
      tags: [comparison]
      summary: Side-by-side matrix — one row per Prayag product with each competitor's price and live diff%
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only rows where Prayag is more expensive than at least one competitor.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonMatrix"
  /catalog/mapping-review:
    get:
      operationId: getMappingReview
      tags: [comparison]
      summary: Competitor rows needing manual mapping (unmatched / ambiguous)
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: confidence
          in: query
          required: false
          description: Filter by match confidence tier (Low, etc.).
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Mapping review rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingReviewList"
  /catalog/competitor-prices/bulk:
    patch:
      operationId: bulkUpdateCompetitorMappings
      tags: [comparison]
      summary: Apply mapping updates to many competitor rows at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMappingUpdate"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMappingResult"
  /catalog/mapping-review/auto-accept:
    post:
      operationId: autoAcceptMappings
      tags: [comparison]
      summary: Auto-accept top suggestions at/above a confidence tier across the current filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoAcceptRequest"
      responses:
        "200":
          description: Auto-accept result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAcceptResult"
  /catalog/mapping-review/auto-accept-preview:
    get:
      operationId: getAutoAcceptPreview
      tags: [comparison]
      summary: Count how many rows each confidence threshold would auto-accept for the current filter
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: confidence
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Per-threshold acceptance counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAcceptPreview"
  /catalog/mapping-review/accept-batches:
    get:
      operationId: getAcceptBatches
      tags: [comparison]
      summary: Recent bulk/auto accept batches that can still be sent back to review
      responses:
        "200":
          description: Recent accept batches (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptBatchList"
    post:
      operationId: recordAcceptBatch
      tags: [comparison]
      summary: Record an accepted batch so it can be reverted later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAcceptBatch"
      responses:
        "200":
          description: Recorded batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptBatch"
  /catalog/mapping-review/accept-batches/{id}:
    delete:
      operationId: deleteAcceptBatch
      tags: [comparison]
      summary: Forget a recorded accept batch (e.g. after it was reverted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptBatchDeleteResult"
  /catalog/competitor-prices/{id}:
    patch:
      operationId: updateCompetitorMapping
      tags: [comparison]
      summary: Assign or correct a competitor row's matched Prayag code and status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorMappingUpdate"
      responses:
        "200":
          description: Updated comparison row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonRow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/competitors/{competitor}:
    delete:
      operationId: deleteCatalogCompetitor
      tags: [comparison]
      summary: Delete all price rows for a competitor brand
      parameters:
        - name: competitor
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCompetitorResult"
  /analysis/filters:
    get:
      operationId: getAnalysisFilters
      tags: [analysis]
      summary: Available filter options
      description: Distinct competitors, Prayag divisions/categories, match confidences and statuses for the analysis filter bar.
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisFilters"
  /analysis/overview:
    get:
      operationId: getAnalysisOverview
      tags: [analysis]
      summary: Headline KPIs
      description: Coverage, match-quality and price-gap KPIs across the filtered competitor SKUs.
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
        - $ref: "#/components/parameters/CompareModeFilter"
      responses:
        "200":
          description: Overview KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisOverview"
  /analysis/by-brand:
    get:
      operationId: getAnalysisByBrand
      tags: [analysis]
      summary: Per-competitor breakdown
      description: Coverage and price-gap stats grouped by competitor brand.
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
        - $ref: "#/components/parameters/CompareModeFilter"
      responses:
        "200":
          description: Per-brand stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisBrandStat"
  /analysis/by-category:
    get:
      operationId: getAnalysisByCategory
      tags: [analysis]
      summary: Per-category breakdown
      description: Price-gap stats grouped by Prayag product category (matched SKUs only).
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
        - $ref: "#/components/parameters/CompareModeFilter"
      responses:
        "200":
          description: Per-category stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisCategoryStat"
  /analysis/positioning:
    get:
      operationId: getAnalysisPositioning
      tags: [analysis]
      summary: Price-gap distribution
      description: Histogram of price_diff_pct across comparable SKUs for a positioning chart.
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
        - $ref: "#/components/parameters/CompareModeFilter"
      responses:
        "200":
          description: Positioning distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisPositioning"
  /analysis/coverage-matrix:
    get:
      operationId: getAnalysisCoverageMatrix
      tags: [analysis]
      summary: Coverage and match-quality matrix
      description: Per-competitor match coverage and confidence-tier breakdown (includes unmatched rows).
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
      responses:
        "200":
          description: Coverage matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisCoverageMatrix"
  /analysis/opportunities:
    get:
      operationId: getAnalysisOpportunities
      tags: [analysis]
      summary: Pricing opportunities and threats
      description: SKUs where Prayag has the largest margin headroom (cheaper) or pricing threats (costlier), beyond the threshold.
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
        - $ref: "#/components/parameters/CompareModeFilter"
        - name: thresholdPct
          in: query
          required: false
          description: Minimum absolute price_diff_pct to qualify. Defaults to 10.
          schema:
            type: number
      responses:
        "200":
          description: Opportunities and threats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisOpportunities"
  /analysis/export:
    get:
      operationId: exportAnalysis
      tags: [analysis]
      summary: Export comparable dataset
      description: Download the filtered, basis-normalized comparison rows as CSV or XLSX.
      parameters:
        - $ref: "#/components/parameters/CompetitorFilter"
        - $ref: "#/components/parameters/DivisionFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/MatchConfidenceFilter"
        - $ref: "#/components/parameters/MatchStatusFilter"
        - $ref: "#/components/parameters/CompareModeFilter"
        - name: format
          in: query
          required: false
          description: File format, "xlsx" (default) or "csv".
          schema:
            type: string
            enum: [xlsx, csv]
      responses:
        "200":
          description: Spreadsheet file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /analysis/discount-settings:
    get:
      operationId: getDiscountSettings
      tags: [analysis]
      summary: Net-to-Net discount settings
      description: Prayag's discount and each competitor's discount (percent). Seeds defaults (Prayag 5%, competitors 40%) on first access.
      responses:
        "200":
          description: Current discount settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountSettings"
    put:
      operationId: updateDiscountSettings
      tags: [analysis]
      summary: Update Net-to-Net discount settings
      description: Upsert Prayag's discount and/or per-competitor discounts. Each percent must be between 0 and 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountSettingsUpdate"
      responses:
        "200":
          description: Updated discount settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    CompetitorFilter:
      name: competitor
      in: query
      required: false
      description: Filter by competitor brand. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    DivisionFilter:
      name: division
      in: query
      required: false
      description: Filter by Prayag division (matched SKUs only).
      schema:
        type: string
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filter by Prayag category (matched SKUs only).
      schema:
        type: string
    MatchConfidenceFilter:
      name: matchConfidence
      in: query
      required: false
      description: Filter by mapping confidence tier (High/Medium/Low).
      schema:
        type: string
    MatchStatusFilter:
      name: matchStatus
      in: query
      required: false
      description: Filter by match status.
      schema:
        type: string
    CompareModeFilter:
      name: mode
      in: query
      required: false
      description: >-
        Comparison basis. "mrp" (default) compares Prayag MRP vs the
        basis-normalized competitor MRP. "net" applies each side's configured
        discount first (Net-to-Net).
      schema:
        type: string
        enum: [mrp, net]
        default: mrp
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    CatalogProductListItem:
      type: object
      required: [id, itemCode, hasPrice]
      properties:
        id:
          type: integer
        itemCode:
          type: string
        productName:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        seriesRange:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        isActive:
          type: boolean
        dataFlag:
          type: ["string", "null"]
        hasPrice:
          type: boolean
        currentMrp:
          type: ["number", "null"]
        currentNet:
          type: ["number", "null"]
        currentBasis:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
    CatalogProductList:
      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProductListItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CatalogProduct:
      type: object
      required: [id, itemCode]
      properties:
        id:
          type: integer
        itemCode:
          type: string
        productName:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        seriesRange:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        kgCost:
          type: ["number", "null"]
        isActive:
          type: boolean
        sourceFiles:
          type: ["string", "null"]
        dataFlag:
          type: ["string", "null"]
    MrpPriceRow:
      type: object
      required: [id, itemCode, effectiveDate, loadDate, priceBasis, isCurrent]
      properties:
        id:
          type: integer
        itemCode:
          type: string
        mrp:
          type: ["number", "null"]
        netPrice:
          type: ["number", "null"]
        discountPct:
          type: ["number", "null"]
        priceBasis:
          type: string
        effectiveDate:
          type: string
        loadDate:
          type: string
        sourceFile:
          type: ["string", "null"]
        isCurrent:
          type: boolean
        notes:
          type: ["string", "null"]
    CatalogProductDetail:
      type: object
      required: [product, history]
      properties:
        product:
          $ref: "#/components/schemas/CatalogProduct"
        history:
          type: array
          items:
            $ref: "#/components/schemas/MrpPriceRow"
    CatalogFilters:
      type: object
      required: [divisions, categories]
      properties:
        divisions:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategoryOption"
    CatalogCategoryOption:
      type: object
      required: [category]
      properties:
        category:
          type: string
        division:
          type: ["string", "null"]
    CatalogConflict:
      type: object
      required: [itemCode]
      properties:
        itemCode:
          type: string
        conflictingNames:
          type: ["string", "null"]
        sources:
          type: ["string", "null"]
    CatalogMissingPrice:
      type: object
      required: [itemCode]
      properties:
        itemCode:
          type: string
        productName:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
    CatalogDuplicateSource:
      type: object
      required: [sourceFiles, count]
      properties:
        sourceFiles:
          type: string
        count:
          type: integer
    CatalogDataHealth:
      type: object
      required:
        [
          totalProducts,
          pricedProducts,
          pendingProducts,
          conflictCount,
          conflicts,
          missingPrices,
          missingPriceCount,
          duplicateSources,
        ]
      properties:
        totalProducts:
          type: integer
        pricedProducts:
          type: integer
        pendingProducts:
          type: integer
        conflictCount:
          type: integer
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/CatalogConflict"
        missingPriceCount:
          type: integer
        missingPrices:
          type: array
          items:
            $ref: "#/components/schemas/CatalogMissingPrice"
        duplicateSources:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDuplicateSource"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    DeleteCompetitorResult:
      type: object
      required: [ok, competitor, deleted]
      properties:
        ok:
          type: boolean
        competitor:
          type: string
        deleted:
          type: integer
          description: Number of competitor price rows removed.
    ComparisonRow:
      type: object
      required:
        - id
        - competitor
        - matchStatus
        - competitorPrice
        - matchedPrayagCode
        - prayagMrp
        - diffPct
        - prayagCheaper
      properties:
        id:
          type: integer
        competitor:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        competitorPrice:
          # Null when a verified mapping exists but the competitor's MRP is not
          # yet known; such rows are stored but never comparable.
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
        matchedPrayagCode:
          type: ["string", "null"]
        matchStatus:
          type: string
        matchConfidence:
          type: ["string", "null"]
        prayagProductName:
          type: ["string", "null"]
        prayagMrp:
          type: ["number", "null"]
        prayagEffectiveDate:
          type: ["string", "null"]
        diffPct:
          type: ["number", "null"]
        prayagCheaper:
          type: ["boolean", "null"]
        compPerMetre:
          type: ["number", "null"]
          description: Competitor price reduced to ₹/metre, when length-normalizable.
        prayagPerMetre:
          type: ["number", "null"]
          description: Prayag MRP reduced to ₹/metre, when length-normalizable.
        perMetreDiffPct:
          type: ["number", "null"]
          description: (prayagPerMetre − compPerMetre) / compPerMetre × 100.
        lengthNormalized:
          type: boolean
          description: True when both sides were compared on a per-metre basis.
        unitAmbiguous:
          type: boolean
          description: >-
            True when the row's unit basis (per pc vs per mtr vs per ft) cannot
            be resolved, so it is excluded from KPIs and flagged for review.
        normalizationNote:
          type: ["string", "null"]
          description: Human-readable explanation of how the row was normalized/flagged.
        effectiveDiffPct:
          type: ["number", "null"]
          description: >-
            The diff% to trust: per-metre diff when length-normalized, raw diff
            otherwise, null when unit-ambiguous.
        effectivePrayagCheaper:
          type: ["boolean", "null"]
          description: True when effectiveDiffPct ≤ 0 (Prayag cheaper).
