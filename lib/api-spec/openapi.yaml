                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  description: Unambiguous ISO calendar date yyyy-mm-dd (for example 2026-03-01).
                extractionPath:
                  $ref: "#/components/schemas/ExtractionPath"
      responses:
        "200":
          description: PDF detection evidence and duplicate decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfPreflight"
        "400": { description: Invalid PDF or input }
  /catalog/import-batches:
    post:
      operationId: uploadCataloguePdf
      tags: [catalog]
      summary: Stage a confirmed PDF extraction for review
      description: Requires a preflight decision. Prices remain staged until approval.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PdfCatalogueUpload"
      responses:
        "200":
          description: SSE extraction stream, or JSON idempotent response when an exact existing batch is reused.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Events: status, batch, progress, done, or error. done contains batchId, status, rowCounts, provenance, and GST warning."
            application/json:
              schema: { $ref: "#/components/schemas/PdfCatalogueUploadResponse" }
        "400":
          description: "Invalid date, extraction path, or PDF"
        "422":
          description: "The requested positional profile is unsupported for this competitor"

  /catalog/ugd-classification/preview:
    post:
      operationId: previewP029UgdClassification
      tags: [catalog]
      summary: Preview the fixed P029 UGD Self Fit sibling classification repair
      responses:
        "200":
          description: Classification preview
          content: { application/json: { schema: { $ref: "#/components/schemas/P029UgdClassificationPreview" } } }
        "400": { description: Invalid or incomplete UGD product pair }
        "403": { description: Administrator access required }
  /catalog/ugd-classification/{correctionKey}/apply:
    post:
      operationId: applyP029UgdClassification
      tags: [catalog]
      summary: Apply a reviewed P029 UGD classification repair
      parameters:
        - { name: correctionKey, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Applied classification repair
          content: { application/json: { schema: { $ref: "#/components/schemas/P029UgdClassificationResult" } } }
        "409": { description: Preview stale or already applied }
        "403": { description: Administrator access required }
  /catalog/ugd-classification/{correctionKey}/undo:
    post:
      operationId: undoP029UgdClassification
      tags: [catalog]
      summary: Undo one applied P029 UGD classification repair
      parameters:
        - { name: correctionKey, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Restored previous classifications
          content: { application/json: { schema: { $ref: "#/components/schemas/P029UgdClassificationResult" } } }
        "409": { description: Current classification changed or already undone }
        "403": { description: Administrator access required }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Bearer session token (used by mobile clients).
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Session cookie (set by browser login flow).
      schema:
        type: string
    CompetitorFilter:
      name: competitor
      in: query
      required: false
      description: Filter by competitor brand. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    DivisionFilter:
      name: division
      in: query
      required: false
      description: Filter by Prayag division (matched SKUs only).
      schema:
        type: string
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filter by Prayag category (matched SKUs only).
      schema:
        type: string
    MatchConfidenceFilter:
      name: matchConfidence
      in: query
      required: false
      description: Filter by mapping confidence tier (High/Medium/Low).
      schema:
        type: string
    MatchStatusFilter:
      name: matchStatus
      in: query
      required: false
      description: Filter by match status.
      schema:
        type: string
    CompareModeFilter:
      name: mode
      in: query
      required: false
      description: >-
        Comparison basis. "mrp" (default) compares Prayag MRP vs the
        basis-normalized competitor MRP. "net" applies each side's configured
        discount first (Net-to-Net).
      schema:
        type: string
        enum: [mrp, net]
        default: mrp
    EffectivePeriodFilter:
      name: effectivePeriod
      in: query
      required: false
      description: ISO date (YYYY-MM-DD). Use prices effective as of this date — the latest Prayag MRP and competitor price ≤ this date. Defaults to current period (is_current = true rows).
      schema:
        type: string
        format: date
  schemas:
    P029UgdClassificationPreview:
      type: object
      required: [correctionKey, status, rows, priceChecks, copiedFields, sizeAction, canApply]
      properties:
        correctionKey: { type: string, format: uuid }
        status: { type: string, enum: [preview] }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        priceChecks: { type: array, items: { type: object, additionalProperties: true } }
        copiedFields: { type: array, items: { type: string } }
        sizeAction: { type: string }
        canApply: { type: boolean }
    P029UgdClassificationResult:
      type: object
      required: [correctionKey, status]
      properties:
        correctionKey: { type: string, format: uuid }
        status: { type: string, enum: [applied, undone] }
        loadBatchId: { type: integer }
        changed: { type: integer }
        restored: { type: integer }
    PdfCatalogueUpload:
      type: object
      required: [file, competitor, effectiveDate, extractionPath, preflightSha256]
      properties:
        file: { type: string, format: binary }
        competitor: { type: string }
        effectiveDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Unambiguous ISO calendar date yyyy-mm-dd.
        priceBasis: { type: string, enum: [MRP, Ex-GST] }
        gstPct: { type: number, minimum: 0, maximum: 100 }
        extractionPath: { $ref: "#/components/schemas/ExtractionPath" }
        preflightSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA returned by the read-only preflight; stale files are rejected.
        overrideReason: { type: string }
    PdfCatalogueUploadResponse:
      type: object
      required: [batchId, status, fileSha256]
      properties:
        batchId: { type: integer }
        status: { type: string, enum: [pending, approved, discarded] }
        fileSha256: { type: string }
        idempotent: { type: boolean }
        extractionPath: { $ref: "#/components/schemas/ExtractionPath" }
        gstSanityWarning:
          anyOf:
            - type: "null"
            - type: object
              required: [previousMedianGap, currentMedianGap, shiftPoints, previousBasis, currentBasis]
              properties:
                previousMedianGap: { type: number }
                currentMedianGap: { type: number }
                shiftPoints: { type: number }
                previousBasis: { type: [string, "null"] }
                currentBasis: { type: string }
                message: { type: string }
        rowCounts: { type: object, additionalProperties: true }
    ExtractionPath:
      type: string
      enum: [text, vision, text_then_ai]
    PdfPagePreflight:
      type: object
      required: [page, characters, digits, textBearing]
      properties:
        page: { type: integer, minimum: 1 }
        characters: { type: integer, minimum: 0 }
        digits: { type: integer, minimum: 0 }
        textBearing: { type: boolean }
    PdfPreflight:
      type: object
      required: [fileSha256, fileSizeBytes, totalPages, samplePages, pages, sampleCount, textBearingCount, textBearingShare, medianCharacters, medianDigits, detectedClass, recommendedPath, textBearingPages, nonTextBearingPages, assignmentTextBearingCount, assignmentNonTextBearingCount, humanReason]
      properties:
        fileSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        fileSizeBytes: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 1 }
        samplePages: { type: array, items: { type: integer } }
        pages: { type: array, items: { $ref: "#/components/schemas/PdfPagePreflight" } }
        sampleCount: { type: integer, minimum: 1 }
        textBearingCount: { type: integer, minimum: 0 }
        textBearingShare: { type: number, minimum: 0, maximum: 1 }
        medianCharacters: { type: number, minimum: 0 }
        medianDigits: { type: number, minimum: 0 }
        detectedClass: { type: string, enum: [text, vision, uncertain] }
        recommendedPath:
          anyOf:
            - $ref: "#/components/schemas/ExtractionPath"
            - type: "null"
        textBearingPages: { type: array, items: { type: integer } }
        nonTextBearingPages: { type: array, items: { type: integer } }
        humanReason: { type: string }
        assignmentTextBearingCount: { type: integer, minimum: 0 }
        assignmentNonTextBearingCount: { type: integer, minimum: 0 }
        duplicate: { type: object, additionalProperties: true }
        duplicateMatches:
          type: array
          items:
            type: object
            required: [batchId, effectiveDate, status]
            properties:
              batchId: { type: integer }
              effectiveDate: { type: string, format: date }
              status: { type: string }
              extractionPath:
                anyOf:
                  - $ref: "#/components/schemas/ExtractionPath"
                  - type: "null"
        latestGst: { type: [object, "null"], additionalProperties: true }
    MrpGeneratorMetadata:
      type: object
      required: [stage, deterministic, salesApi, disabledRules, supportedRules, staleAfterMonths, sources]
      properties:
        stage: { type: integer }
        deterministic: { type: boolean }
        salesApi: { $ref: "#/components/schemas/MrpGeneratorSalesApi" }
        disabledRules:
          type: array
          items: { $ref: "#/components/schemas/MrpGeneratorDisabledRule" }
        supportedRules:
          type: array
          items: { type: string }
        staleAfterMonths: { type: integer }
        policyVersions: { type: array, items: { type: integer } }
        p011: { type: object, additionalProperties: true }
        p012: { type: object, additionalProperties: true }
        options:
          type: object
          required: [competitiveOnly, margin, volume]
          properties:
            competitiveOnly: { type: object, additionalProperties: true }
            margin: { $ref: "#/components/schemas/MrpGeneratorOptionStatus" }
            volume: { $ref: "#/components/schemas/MrpGeneratorOptionStatus" }
        sources:
          type: array
          items: { type: string }
    MrpGeneratorSalesApi:
      type: object
      required: [available, status]
      properties:
        available: { type: boolean }
        status: { type: string, enum: [authenticated, missing_credential, auth_failed, unavailable, rate_limited] }
        reason: { type: [string, "null"] }
        confidence: { type: [string, "null"], enum: [STRONG, MODERATE, WEAK, NONE, null] }
        seriesRate: { type: [number, "null"] }
        due: { type: [boolean, "null"] }
        overdue: { type: [boolean, "null"] }
        dataSource: { type: [string, "null"] }
        endpoint: { type: [string, "null"] }
        upstreamStatus: { type: [integer, "null"] }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        requestMetrics: { $ref: "#/components/schemas/MrpGeneratorRequestMetrics" }
        retryAt: { type: [string, "null"], format: date-time }
        retryAfterSeconds: { type: [integer, "null"] }
        pageSize: { type: integer }
        requestsMade: { type: integer }
        completedPages: { type: integer }
        requestLimit: { type: integer }
        requestWindowSeconds: { type: integer }
        components:
          type: object
          properties:
            sales: { $ref: "#/components/schemas/MrpGeneratorOptionStatus" }
            margin: { $ref: "#/components/schemas/MrpGeneratorOptionStatus" }
    MrpGeneratorOptionStatus:
      type: object
      required: [available, status]
      properties:
        available: { type: boolean }
        status: { type: string, enum: [authenticated, missing_credential, auth_failed, unavailable, rate_limited] }
        reason: { type: [string, "null"] }
        coverage: { type: [string, "null"] }
        coverageDetail: { type: [object, "null"], additionalProperties: true }
        endpoint: { type: [string, "null"] }
        upstreamStatus: { type: [integer, "null"] }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        requestMetrics: { $ref: "#/components/schemas/MrpGeneratorRequestMetrics" }
        retryAt: { type: [string, "null"], format: date-time }
        retryAfterSeconds: { type: [integer, "null"] }
        pageSize: { type: integer }
        requestsMade: { type: integer }
        completedPages: { type: integer }
        requestLimit: { type: integer }
        requestWindowSeconds: { type: integer }
    MrpGeneratorDisabledRule:
      type: object
      required: [type, reason, configurationSummary]
      properties:
        type: { type: string, enum: [margin_floor, volume_tier] }
        reason: { type: string }
        configurationSummary: { type: string }
    MrpGeneratorScopes:
      type: object
      required: [divisions, series, categories, categoryPairs, competitors]
      properties:
        divisions: { type: array, items: { type: string } }
        series: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        categoryPairs:
          type: array
          description: Active Price Finder browse division/category combinations; null category denotes uncategorised products.
          items:
            type: object
            required: [division, category, count]
            properties:
              division: { type: string }
              category: { type: [string, "null"] }
              count: { type: integer }
        competitors: { type: array, items: { type: string } }
    MrpGeneratorScope:
      type: object
      properties:
        division:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        series:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        category:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        competitorMapped: { type: boolean }
        explicitCodes: { type: array, items: { type: string } }
        itemCodes: { type: array, items: { type: string } }
        codes: { type: array, items: { type: string } }
        confidenceOnly: { type: boolean }
    MrpGeneratorRuleScope:
      type: object
      properties:
        scope: { $ref: "#/components/schemas/MrpGeneratorScope" }
    MrpGeneratorRule:
      oneOf:
        - $ref: "#/components/schemas/MrpGeneratorScopeRule"
        - $ref: "#/components/schemas/MrpGeneratorPercentBelowRule"
        - $ref: "#/components/schemas/MrpGeneratorMatchRule"
        - $ref: "#/components/schemas/MrpGeneratorPercentAboveLowestRule"
        - $ref: "#/components/schemas/MrpGeneratorMaxIncreaseRule"
        - $ref: "#/components/schemas/MrpGeneratorMaxDecreaseRule"
        - $ref: "#/components/schemas/MrpGeneratorHoldBelowRule"
        - $ref: "#/components/schemas/MrpGeneratorRoundingRule"
        - $ref: "#/components/schemas/MrpGeneratorMarginFloorRule"
        - $ref: "#/components/schemas/MrpGeneratorVolumeTierRule"
      discriminator:
        propertyName: type
    MrpGeneratorScopeRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type]
          properties:
            type: { const: scope }
    MrpGeneratorPercentBelowRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, competitor, percent]
          properties:
            type: { const: percent_below }
            competitor: { type: string }
            percent: { type: number, minimum: 0, maximum: 100 }
    MrpGeneratorMatchRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, competitor]
          properties:
            type: { const: match }
            competitor: { type: string }
    MrpGeneratorPercentAboveLowestRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, percent]
          properties:
            type: { const: percent_above_lowest }
            percent: { type: number, minimum: 0, maximum: 100 }
    MrpGeneratorMaxIncreaseRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, percent]
          properties:
            type: { const: max_increase }
            percent: { type: number, minimum: 0, maximum: 100 }
    MrpGeneratorMaxDecreaseRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, percent]
          properties:
            type: { const: max_decrease }
            percent: { type: number, minimum: 0, maximum: 100 }
    MrpGeneratorHoldBelowRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, threshold]
          properties:
            type: { const: hold_below }
            threshold: { type: number, minimum: 0 }
    MrpGeneratorRoundingRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, unit, direction]
          properties:
            type: { const: rounding }
            unit: { type: integer, enum: [1, 5, 10, 50] }
            direction: { type: string, enum: [nearest, up, down] }
    MrpGeneratorMarginFloorRule:
      allOf:
        - $ref: "#/components/schemas/MrpGeneratorRuleScope"
        - type: object
          required: [type, categoryFloors]
          properties:
            type: { const: margin_floor }
            categoryFloors:
              type: object
              properties:
                PTMT: { type: number, minimum: 0, exclusiveMaximum: 100, default: 65 }
                C P: { type: number, minimum: 0, exclusiveMaximum: 100, default: 38 }
                PLUMBING: { type: number, minimum: 0, exclusiveMaximum: 100, default: 30 }
                SANITARYWARE: { type: number, minimum: 0, exclusiveMaximum: 100, default: 38 }
                SINK: { type: number, minimum: 0, exclusiveMaximum: 100, default: 40 }
                HARDWARE: { type: number, minimum: 0, exclusiveMaximum: 100, default: 38 }
    MrpGeneratorVolumeTierRule:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/MrpGeneratorRuleScope"
            - type: object
              required: [type, period, mode, tier, cumulativeValuePercent]
              properties:
                type: { const: volume_tier }
                period: { type: string, enum: ["2026-27"], description: The only currently supported Sales period. }
                mode: { enum: [cumulative, cumulative_contribution] }
                tier: { type: string, enum: [A, B, C] }
                cumulativeValuePercent: { type: integer, enum: [80, 95, 100] }
        - allOf:
            - $ref: "#/components/schemas/MrpGeneratorRuleScope"
            - type: object
              required: [type, period, mode, operator, salesValue]
              properties:
                type: { const: volume_tier }
                period: { type: string, enum: ["2026-27"], description: The only currently supported Sales period. }
                mode: { enum: [value_threshold, threshold] }
                operator: { type: string, enum: [above, below] }
                salesValue: { type: number, minimum: 0 }
    MrpGeneratorPolicy:
      type: object
      required: [policyVersion, period]
      description: >
        P011 deterministic policy. Bands use cumulative taxable sales
        contribution; band F is the separate no-sales exclusion.
      properties:
        policyVersion: { type: integer, const: 2 }
        period: { type: string, enum: ["2026-27"] }
        bands:
          type: object
          properties:
            A: { type: number, minimum: 0, maximum: 1 }
            B: { type: number, minimum: 0, maximum: 1 }
            C: { type: number, minimum: 0, maximum: 1 }
            D: { type: number, minimum: 0, maximum: 1 }
        position:
          type: object
          properties:
            wellBelowAbove: { type: number }
            parityBelow: { type: number }
            parityAbove: { type: number }
        competitor:
          type: object
          properties:
            mode: { type: string, enum: [nearest, lowest, named] }
            named: { type: [string, "null"] }
            staleAfterDays: { type: integer, minimum: 0, default: 365 }
            excludeStale: { type: boolean, default: true }
        captureShares:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        defendTargetUndercut: { type: number, minimum: 0, maximum: 1 }
        categoryFloors:
          type: object
          additionalProperties: { type: number, minimum: 0, exclusiveMaximum: 100 }
        marginTargetUpliftPoints: { type: number, minimum: 0 }
        maxIncreasePercent: { type: number, minimum: 0 }
        maxDecreasePercent: { type: number, minimum: 0 }
        holdThreshold: { type: number, minimum: 0, default: 50 }
        rounding:
          type: object
          properties:
            unit: { type: number, minimum: 0 }
            direction: { type: string, enum: [nearest, up, down] }
        portfolio:
          type: object
          properties:
            mode: { type: string, enum: [hold_current, improve_by_points, allow_decline_points] }
            points: { type: number, minimum: 0 }
    MrpGeneratorScenarioInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/MrpGeneratorScope" }
        rules: { type: array, items: { $ref: "#/components/schemas/MrpGeneratorRule" } }
        policyVersion: { type: integer, enum: [2, 3] }
        policy: { $ref: "#/components/schemas/MrpGeneratorPolicy" }
        simplePolicy: { $ref: "#/components/schemas/MrpGeneratorSimplePolicy" }
        advancedPolicy: { $ref: "#/components/schemas/MrpGeneratorAdvancedPolicy" }
    MrpGeneratorSimpleCompetitor:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [named, nearest, lowest] }
        name: { type: [string, "null"] }
    MrpGeneratorSimpleRule:
      type: object
      required: [id, order, label, competitor, appliesTo, target]
      properties:
        id: { type: string }
        order: { type: integer }
        label: { type: string }
        competitor: { $ref: "#/components/schemas/MrpGeneratorSimpleCompetitor" }
        appliesTo:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [division, series, category, explicit_codes, all] }
            value:
              oneOf:
                - { type: string }
                - { type: array, items: { type: string } }
                - { type: "null" }
        target:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [below, match, above, close_gap, hold] }
            percent: { type: [number, "null"], minimum: 0 }
        maxIncrease: { type: [number, "null"], minimum: 0 }
        maxDecrease: { type: [number, "null"], minimum: 0 }
        minBelowPercent: { type: [number, "null"], minimum: 0, maximum: 100, description: Match only when the nearest competitor is more than this percentage above current MRP. }
        catchAll: { type: boolean }
    MrpGeneratorSimplePolicy:
      type: object
      required: [policyVersion, mode, holdBelow, rounding, marginEnabled, volumeEnabled, rows]
      properties:
        policyVersion: { type: integer, const: 3 }
        mode: { type: string, const: simple }
        holdBelow: { type: number, minimum: 0 }
        rounding:
          type: object
          required: [unit, direction]
          properties:
            unit: { type: number, minimum: 0 }
            direction: { type: string, enum: [nearest, up, down] }
        marginEnabled: { type: boolean }
        volumeEnabled: { type: boolean }
        categoryFloors:
          type: object
          additionalProperties: { type: number, minimum: 0, exclusiveMaximum: 100 }
        rows: { type: array, items: { $ref: "#/components/schemas/MrpGeneratorSimpleRule" } }
    MrpGeneratorAdvancedPolicy:
      type: object
      required: [policyVersion, mode, source, simpleRows, rules, holdBelow, rounding, marginEnabled, volumeEnabled]
      properties:
        policyVersion: { type: integer, const: 2 }
        mode: { type: string, const: advanced }
        source: { type: string, const: p012-simple }
        simpleRows: { type: array, items: { $ref: "#/components/schemas/MrpGeneratorSimpleRule" } }
        rules: { type: array, items: { $ref: "#/components/schemas/MrpGeneratorRule" } }
        holdBelow: { type: number, minimum: 0 }
        rounding:
          type: object
          required: [unit, direction]
          properties:
            unit: { type: number, exclusiveMinimum: 0 }
            direction: { type: string, enum: [nearest, up, down] }
        marginEnabled: { type: boolean }
        volumeEnabled: { type: boolean }
        categoryFloors:
          type: object
          additionalProperties: { type: number, minimum: 0, exclusiveMaximum: 100 }
    MrpGeneratorSimplePreviewInput:
      type: object
      required: [simplePolicy]
      properties:
        simplePolicy: { $ref: "#/components/schemas/MrpGeneratorSimplePolicy" }
        scope: { $ref: "#/components/schemas/MrpGeneratorScope" }
        asOf: { type: string, format: date }
        limit: { type: integer, minimum: 1, maximum: 100 }
    MrpGeneratorSimplePreview:
      type: object
      required: [preview, summary, reach, warnings, evidence]
      properties:
        preview: { type: boolean }
        asOf: { type: string, format: date }
        summary: { $ref: "#/components/schemas/MrpGeneratorSimplePreviewSummary" }
        reach: { type: object, additionalProperties: { $ref: "#/components/schemas/MrpGeneratorSimpleReach" } }
        warnings: { type: array, items: { type: string } }
        evidence: { type: array, items: { $ref: "#/components/schemas/MrpGeneratorResult" } }
    MrpGeneratorSimplePreviewRowCounts:
      type: object
