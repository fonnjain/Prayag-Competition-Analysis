    ComparisonRow:
      type: object
      required:
        - id
        - competitor
        - matchStatus
        - competitorPrice
        - competitorValidTo
        - upcomingCompetitorPrice
        - upcomingCompetitorEffectiveDate
        - upcomingCompetitorChangePct
        - competitorPriceIsCurrent
        - matchedPrayagCode
        - prayagMrp
        - prayagValidTo
        - upcomingPrayagMrp
        - upcomingPrayagEffectiveDate
        - upcomingPrayagChangePct
        - diffPct
        - prayagCheaper
        - upcomingGapDate
        - upcomingGapPrayagPrice
        - upcomingGapCompetitorPrice
        - upcomingGapPct
        - upcomingGapDirection
        - upcomingGapIsReversal
      properties:
        id:
          type: integer
        competitor:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        competitorPrice:
          # Null when a verified mapping exists but the competitor's MRP is not
          # yet known; such rows are stored but never comparable.
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
          description: First day this competitor row's price is valid.
        competitorValidTo:
          type: ["string", "null"]
          description: Final day this competitor row's price is valid, or null when open-ended.
        upcomingCompetitorPrice:
          type: ["number", "null"]
        upcomingCompetitorEffectiveDate:
          type: ["string", "null"]
        upcomingCompetitorChangePct:
          type: ["number", "null"]
          description: One-decimal row-to-next-period change; zero is retained.
        competitorPriceIsCurrent:
          type: boolean
          description: True only for the latest row already in force; only these rows receive headline gaps.
        newerRevisionAwaitingReview:
          type: boolean
          description: >-
            True when this confirmed price still drives the official gap while a
            newer unconfirmed mapping for the same competitor and Prayag SKU awaits review.
        newerRevisionEffectiveDate:
          type: ["string", "null"]
          description: Effective date (YYYY-MM-DD) of the newer unconfirmed revision, if any.
        newerRevisionReviewStatus:
          type: ["string", "null"]
          description: Review status of the newer revision, such as needs_review.
        matchedPrayagCode:
          type: ["string", "null"]
        matchStatus:
          type: string
        matchConfidence:
          type: ["string", "null"]
        prayagProductName:
          type: ["string", "null"]
        prayagMrp:
          type: ["number", "null"]
        prayagEffectiveDate:
          type: ["string", "null"]
        prayagValidTo:
          type: ["string", "null"]
        upcomingPrayagMrp:
          type: ["number", "null"]
        upcomingPrayagEffectiveDate:
          type: ["string", "null"]
        upcomingPrayagChangePct:
          type: ["number", "null"]
        diffPct:
          type: ["number", "null"]
          description: >-
            Canonical market gap: (competitor effective price - Prayag MRP) /
            Prayag MRP × 100. Positive means Prayag is cheaper.
        prayagCheaper:
          type: ["boolean", "null"]
        upcomingGapDate:
          type: ["string", "null"]
          format: date
        upcomingGapPrayagPrice:
          type: ["number", "null"]
        upcomingGapCompetitorPrice:
          type: ["number", "null"]
        upcomingGapPct:
          type: ["number", "null"]
          description: Date-aligned future gap; positive means Prayag is cheaper.
        upcomingGapDirection:
          type: ["string", "null"]
        upcomingGapIsReversal:
          type: boolean
        compPerMetre:
          type: ["number", "null"]
          description: Competitor price reduced to ₹/metre, when length-normalizable.
        prayagPerMetre:
          type: ["number", "null"]
          description: Prayag MRP reduced to ₹/metre, when length-normalizable.
        perMetreDiffPct:
          type: ["number", "null"]
          description: (compPerMetre − prayagPerMetre) / prayagPerMetre × 100; positive means Prayag is cheaper.
        lengthNormalized:
          type: boolean
          description: True when both sides were compared on a per-metre basis.
        unitAmbiguous:
          type: boolean
          description: >-
            True when the row's unit basis (per pc vs per mtr vs per ft) cannot
            be resolved, so it is excluded from KPIs and flagged for review.
        normalizationNote:
          type: ["string", "null"]
          description: Human-readable explanation of how the row was normalized/flagged.
        effectiveDiffPct:
          type: ["number", "null"]
          description: >-
            The diff% to trust: per-metre diff when length-normalized, raw diff
            otherwise, null when unit-ambiguous.
        effectivePrayagCheaper:
          type: ["boolean", "null"]
          description: True when effectiveDiffPct is positive (Prayag cheaper).
