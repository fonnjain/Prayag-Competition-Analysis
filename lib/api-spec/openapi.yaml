openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Prayag Competition Console API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Competition analysis dashboard
  - name: products
    description: Prayag products and comparison matrix
  - name: recommendations
    description: Pricing recommendations
  - name: competitors
    description: Competitor management
  - name: settings
    description: App settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Competition analysis KPIs
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /categories:
    get:
      operationId: getCategories
      tags: [products]
      summary: List product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Comparison matrix rows
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: onlyRivalCheaper
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Matrix rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMatrix"
  /products/{itemCode}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Edit a Prayag product's prices
      parameters:
        - name: itemCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRow"
  /comparisons/{id}:
    patch:
      operationId: updateComparison
      tags: [products]
      summary: Edit a competitor price point
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonUpdate"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRow"
  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Pricing recommendations
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Recommendation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
  /competitors:
    get:
      operationId: getCompetitors
      tags: [competitors]
      summary: List competitors
      responses:
        "200":
          description: Competitor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"
  /competitors/{name}:
    patch:
      operationId: updateCompetitor
      tags: [competitors]
      summary: Hide or show a competitor
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorUpdate"
      responses:
        "200":
          description: Updated competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
    delete:
      operationId: deleteCompetitor
      tags: [competitors]
      summary: Remove a competitor and its price points
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /reset:
    post:
      operationId: resetData
      tags: [settings]
      summary: Reset all data to the original seed
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /catalog/products:
    get:
      operationId: getCatalogProducts
      tags: [catalog]
      summary: List catalog products with current MRP
      parameters:
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: priceStatus
          in: query
          required: false
          description: Filter by price presence. "priced" or "pending".
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductList"
  /catalog/products/{itemCode}:
    get:
      operationId: getCatalogProduct
      tags: [catalog]
      summary: Get a product with its full MRP price history
      parameters:
        - name: itemCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/filters:
    get:
      operationId: getCatalogFilters
      tags: [catalog]
      summary: Available divisions and categories for filtering
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFilters"
  /catalog/data-health:
    get:
      operationId: getCatalogDataHealth
      tags: [catalog]
      summary: Data health report (conflicts, missing prices, duplicate sources)
      responses:
        "200":
          description: Data health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDataHealth"
  /catalog/reset:
    post:
      operationId: resetCatalog
      tags: [catalog]
      summary: Reset the product catalog to the original clean import
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /catalog/comparison:
    get:
      operationId: getComparison
      tags: [comparison]
      summary: Competitor price points joined to Prayag's current MRP with live diff%
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: matchStatus
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only rows where Prayag is more expensive than the competitor.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonList"
  /catalog/comparison/summary:
    get:
      operationId: getComparisonSummary
      tags: [comparison]
      summary: Competitive-share KPI and per-category Prayag win-rate
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Comparison summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonSummary"
  /catalog/comparison/filters:
    get:
      operationId: getComparisonFilters
      tags: [comparison]
      summary: Available competitors, categories, and match statuses for filtering
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonFilters"
  /catalog/mapping-review:
    get:
      operationId: getMappingReview
      tags: [comparison]
      summary: Competitor rows needing manual mapping (unmatched / ambiguous)
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Mapping review rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingReviewList"
  /catalog/competitor-prices/{id}:
    patch:
      operationId: updateCompetitorMapping
      tags: [comparison]
      summary: Assign or correct a competitor row's matched Prayag code and status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorMappingUpdate"
      responses:
        "200":
          description: Updated comparison row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonRow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    CatalogProductListItem:
      type: object
      required: [id, itemCode, hasPrice]
      properties:
        id:
          type: integer
        itemCode:
          type: string
        productName:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        seriesRange:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        isActive:
          type: boolean
        dataFlag:
          type: ["string", "null"]
        hasPrice:
          type: boolean
        currentMrp:
          type: ["number", "null"]
        currentNet:
          type: ["number", "null"]
        currentBasis:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
    CatalogProductList:
      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProductListItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CatalogProduct:
      type: object
      required: [id, itemCode]
      properties:
        id:
          type: integer
        itemCode:
          type: string
        productName:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        seriesRange:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        kgCost:
          type: ["number", "null"]
        isActive:
          type: boolean
        sourceFiles:
          type: ["string", "null"]
        dataFlag:
          type: ["string", "null"]
    MrpPriceRow:
      type: object
      required: [id, itemCode, effectiveDate, loadDate, priceBasis, isCurrent]
      properties:
        id:
          type: integer
        itemCode:
          type: string
        mrp:
          type: ["number", "null"]
        netPrice:
          type: ["number", "null"]
        discountPct:
          type: ["number", "null"]
        priceBasis:
          type: string
        effectiveDate:
          type: string
        loadDate:
          type: string
        sourceFile:
          type: ["string", "null"]
        isCurrent:
          type: boolean
        notes:
          type: ["string", "null"]
    CatalogProductDetail:
      type: object
      required: [product, history]
      properties:
        product:
          $ref: "#/components/schemas/CatalogProduct"
        history:
          type: array
          items:
            $ref: "#/components/schemas/MrpPriceRow"
    CatalogFilters:
      type: object
      required: [divisions, categories]
      properties:
        divisions:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategoryOption"
    CatalogCategoryOption:
      type: object
      required: [category]
      properties:
        category:
          type: string
        division:
          type: ["string", "null"]
    CatalogConflict:
      type: object
      required: [itemCode]
      properties:
        itemCode:
          type: string
        conflictingNames:
          type: ["string", "null"]
        sources:
          type: ["string", "null"]
    CatalogMissingPrice:
      type: object
      required: [itemCode]
      properties:
        itemCode:
          type: string
        productName:
          type: ["string", "null"]
        division:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
    CatalogDuplicateSource:
      type: object
      required: [sourceFiles, count]
      properties:
        sourceFiles:
          type: string
        count:
          type: integer
    CatalogDataHealth:
      type: object
      required:
        [
          totalProducts,
          pricedProducts,
          pendingProducts,
          conflictCount,
          conflicts,
          missingPrices,
          missingPriceCount,
          duplicateSources,
        ]
      properties:
        totalProducts:
          type: integer
        pricedProducts:
          type: integer
        pendingProducts:
          type: integer
        conflictCount:
          type: integer
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/CatalogConflict"
        missingPriceCount:
          type: integer
        missingPrices:
          type: array
          items:
            $ref: "#/components/schemas/CatalogMissingPrice"
        duplicateSources:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDuplicateSource"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    CompetitorCell:
      type: object
      required: [competitor, basis, price, diffPct, isCheapest]
      properties:
        competitor:
          type: string
        basis:
          type: string
          enum: [net, mrp]
        price:
          type: ["number", "null"]
        diffPct:
          type: ["number", "null"]
        isCheapest:
          type: boolean
    ProductRow:
      type: object
      required:
        - itemCode
        - category
        - prayagMrp
        - prayagNet
        - kgCost
        - basis
        - shownPrice
        - competitors
        - cheapestRival
        - cheapestRivalName
        - prayagLowest
        - rivalCount
        - status
        - marketMin
        - marketMedian
        - marketMax
        - suggestedPrice
        - aggressiveTarget
        - gap
        - gapPct
        - marginConstrained
        - edited
      properties:
        itemCode:
          type: string
        category:
          type: string
        size:
          type: ["string", "null"]
        prayagMrp:
          type: ["number", "null"]
        prayagNet:
          type: ["number", "null"]
        kgCost:
          type: ["number", "null"]
        basis:
          type: string
          enum: [net, mrp]
        shownPrice:
          type: ["number", "null"]
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorCell"
        cheapestRival:
          type: ["number", "null"]
        cheapestRivalName:
          type: ["string", "null"]
        prayagLowest:
          type: boolean
        rivalCount:
          type: integer
        status:
          type: string
          enum: [leader, competitive, above_market, overpriced, no_data]
        marketMin:
          type: ["number", "null"]
        marketMedian:
          type: ["number", "null"]
        marketMax:
          type: ["number", "null"]
        suggestedPrice:
          type: ["number", "null"]
        aggressiveTarget:
          type: ["number", "null"]
        gap:
          type: ["number", "null"]
        gapPct:
          type: ["number", "null"]
        marginConstrained:
          type: boolean
        edited:
          type: boolean
    ProductMatrix:
      type: object
      required: [competitors, rows, total]
      properties:
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/Competitor"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ProductRow"
        total:
          type: integer
    ProductUpdate:
      type: object
      properties:
        prayagMrp:
          type: ["number", "null"]
        prayagNet:
          type: ["number", "null"]
        kgCost:
          type: ["number", "null"]
    ComparisonUpdate:
      type: object
      required: [compPrice]
      properties:
        compPrice:
          type: ["number", "null"]
    Recommendation:
      type: object
      required:
        - itemCode
        - category
        - basis
        - currentPrice
        - marketMin
        - marketMedian
        - marketMax
        - status
        - suggestedPrice
        - aggressiveTarget
        - gap
        - gapPct
        - marginConstrained
        - rivalCount
      properties:
        itemCode:
          type: string
        category:
          type: string
        size:
          type: ["string", "null"]
        basis:
          type: string
          enum: [net, mrp]
        currentPrice:
          type: ["number", "null"]
        marketMin:
          type: ["number", "null"]
        marketMedian:
          type: ["number", "null"]
        marketMax:
          type: ["number", "null"]
        status:
          type: string
          enum: [leader, competitive, above_market, overpriced, no_data]
        suggestedPrice:
          type: ["number", "null"]
        aggressiveTarget:
          type: ["number", "null"]
        gap:
          type: ["number", "null"]
        gapPct:
          type: ["number", "null"]
        marginConstrained:
          type: boolean
        rivalCount:
          type: integer
    Competitor:
      type: object
      required: [name, basis, productsCompared, prayagCheaper, prayagCheaperPct, avgSavingPct, hidden]
      properties:
        name:
          type: string
        basis:
          type: string
          enum: [net, mrp, mixed]
        productsCompared:
          type: integer
        prayagCheaper:
          type: integer
        prayagCheaperPct:
          type: ["number", "null"]
        avgSavingPct:
          type: ["number", "null"]
        hidden:
          type: boolean
    CompetitorUpdate:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
    DashboardSummary:
      type: object
      required:
        - totalProducts
        - comparedProducts
        - competitiveShare
        - leaderCount
        - competitiveCount
        - aboveMarketCount
        - overpricedCount
        - competitorWinRates
        - categoryBreakdown
      properties:
        totalProducts:
          type: integer
        comparedProducts:
          type: integer
        competitiveShare:
          type: number
        leaderCount:
          type: integer
        competitiveCount:
          type: integer
        aboveMarketCount:
          type: integer
        overpricedCount:
          type: integer
        competitorWinRates:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorWinRate"
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdown"
    CompetitorWinRate:
      type: object
      required: [competitor, basis, productsCompared, prayagCheaper, prayagCheaperPct, avgSavingPct]
      properties:
        competitor:
          type: string
        basis:
          type: string
        productsCompared:
          type: integer
        prayagCheaper:
          type: integer
        prayagCheaperPct:
          type: ["number", "null"]
        avgSavingPct:
          type: ["number", "null"]
    CategoryBreakdown:
      type: object
      required: [category, total, leader, competitive, aboveMarket, overpriced, competitivePct]
      properties:
        category:
          type: string
        total:
          type: integer
        leader:
          type: integer
        competitive:
          type: integer
        aboveMarket:
          type: integer
        overpriced:
          type: integer
        competitivePct:
          type: ["number", "null"]
    Settings:
      type: object
      required: [minimumMarginPct]
      properties:
        minimumMarginPct:
          type: number
    SettingsInput:
      type: object
      required: [minimumMarginPct]
      properties:
        minimumMarginPct:
          type: number
    ComparisonRow:
      type: object
      required:
        - id
        - competitor
        - matchStatus
        - competitorPrice
        - matchedPrayagCode
        - prayagMrp
        - diffPct
        - prayagCheaper
      properties:
        id:
          type: integer
        competitor:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        competitorPrice:
          type: number
        unit:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
        matchedPrayagCode:
          type: ["string", "null"]
        matchStatus:
          type: string
        prayagProductName:
          type: ["string", "null"]
        prayagMrp:
          type: ["number", "null"]
        prayagEffectiveDate:
          type: ["string", "null"]
        diffPct:
          type: ["number", "null"]
        prayagCheaper:
          type: ["boolean", "null"]
    ComparisonList:
      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ComparisonCategoryWinRate:
      type: object
      required: [category, comparable, prayagCheaper, prayagCheaperPct]
      properties:
        category:
          type: string
        comparable:
          type: integer
        prayagCheaper:
          type: integer
        prayagCheaperPct:
          type: ["number", "null"]
        avgDiffPct:
          type: ["number", "null"]
    ComparisonSummary:
      type: object
      required:
        - competitor
        - totalRows
        - matchedRows
        - comparableRows
        - prayagCheaperCount
        - prayagCheaperPct
        - reviewCount
        - categoryWinRates
      properties:
        competitor:
          type: ["string", "null"]
        totalRows:
          type: integer
        matchedRows:
          type: integer
        comparableRows:
          type: integer
        prayagCheaperCount:
          type: integer
        prayagCheaperPct:
          type: ["number", "null"]
        avgDiffPct:
          type: ["number", "null"]
        reviewCount:
          type: integer
