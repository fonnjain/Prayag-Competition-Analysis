      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ProductComparisonCell:
      type: object
