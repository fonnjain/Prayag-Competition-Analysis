openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Prayag Polymers pricing-intelligence API (product catalog, MRP history, competition analysis)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Competition analysis dashboard (live-computed, basis-normalized)
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: admin
    description: Workspace user management (admin only).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /keys:
    get:
      operationId: getApiKeys
      tags: [apiKeys]
      summary: List API keys (never returns the secret; only prefix + metadata)
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
    post:
      operationId: createApiKey
      tags: [apiKeys]
      summary: Generate a new API key. The full secret is returned ONCE in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: Key created (full secret shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /keys/{id}/revoke:
    post:
      operationId: revokeApiKey
      tags: [apiKeys]
      summary: Revoke an API key (it stops working immediately; row is kept for audit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /keys/{id}:
    delete:
      operationId: deleteApiKey
      tags: [apiKeys]
      summary: Permanently delete an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/products:
    get:
      operationId: externalListProducts
      tags: [external]
      summary: "External API: list products with current MRP (requires X-API-Key header)"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: asOf
          in: query
          required: false
          description: Resolve catalog availability and MRP as of this date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductList"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/product:
    get:
      operationId: externalGetProduct
      tags: [external]
      summary: "External API: product detail with MRP history (requires X-API-Key header)"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: itemCode
          in: query
          required: true
          schema:
            type: string
        - name: asOf
          in: query
          required: false
          description: Resolve product availability as of this date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Product detail with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductDetail"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/comparison:
    get:
      operationId: externalGetComparison
      tags: [external]
      summary: "External API: competitor comparison rows (requires X-API-Key header)"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonList"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/analysis/overview:
    get:
      operationId: externalGetAnalysisOverview
      tags: [external]
      summary: "External API: market analysis overview KPIs (requires X-API-Key header)"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Analysis overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisOverview"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/products:
    get:
      operationId: getCatalogProducts
      tags: [catalog]
      summary: List catalog products with current MRP
      parameters:
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: priceStatus
          in: query
          required: false
          description: Filter by price presence. "priced" or "pending".
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: asOf
          in: query
          required: false
          description: Resolve catalog availability and MRP as of this date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductList"
  /catalog/product:
    get:
      operationId: getCatalogProduct
      tags: [catalog]
      summary: Get a product with its full MRP price history
      parameters:
        - name: itemCode
          in: query
          required: true
          schema:
            type: string
        - name: asOf
          in: query
          required: false
          description: Resolve product availability as of this date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Product detail with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /price-finder/search:
    get:
      operationId: getPriceFinderSearch
      tags: [catalog]
      summary: Progressively filter Price Finder products by spoken or typed terms
      parameters:
        - name: q
          in: query
          required: false
          description: Backwards-compatible single filter term.
          schema:
            type: string
        - name: filters
          in: query
          required: false
          description: Accumulating filter phrases. Each must match a product field.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3000
            default: 3000
      responses:
        "200":
          description: Matching products, live count, and next-filter suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceFinderSearchResponse"
  /price-finder/browse:
    get:
      operationId: getPriceFinderBrowse
      tags: [catalog]
      summary: Browse the catalogue by division and category
      parameters:
        - name: division
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Use "__uncategorised__" for blank categories.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 300
            default: 200
      responses:
        "200":
          description: Browse options and, when selected, products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceFinderBrowseResponse"
  /price-finder/product:
    get:
      operationId: getPriceFinderProduct
      tags: [catalog]
      summary: Get current Prayag and competitor prices for one product
      parameters:
        - name: itemCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Price Finder product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceFinderProductResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /price-finder/comparison:
    get:
      operationId: getPriceFinderComparison
      tags: [catalog]
      summary: Compare selected Price Finder products against selected competitors
      description: >
        Read-only dated comparison for up to 50 catalog products. Both Prayag
        and competitor prices resolve to the latest eligible revision on or
        before the same as-of date; future revisions are returned separately.
      parameters:
        - name: code
          in: query
          required: true
          style: form
          explode: true
          description: One or more selected Prayag item codes, maximum 50.
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
        - name: competitor
          in: query
          required: false
          style: form
          explode: true
          description: Competitor brands to include. Defaults to Sparsh Pearl. Missing competitor data is returned as no data, never as zero.
          schema:
            type: array
            items:
              type: string
              enum: [Sparsh Pearl, Ashirvad, Prince, Vectus]
        - name: asOf
          in: query
          required: false
          description: Resolve both sides as of this date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dated product comparisons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceFinderComparisonResponse"
        "400":
          description: Invalid selection or filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /price-finder/comparison/export:
    get:
      operationId: exportPriceFinderComparison
      tags: [catalog]
      summary: Export selected Price Finder comparisons
      parameters:
        - name: code
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
        - name: competitor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [Sparsh Pearl, Ashirvad, Prince, Vectus]
        - name: asOf
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: XLSX comparison export
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid selection or filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/product/mrp:
    patch:
      operationId: patchCatalogProductMrp
      tags: [catalog]
      summary: Set a new current MRP for a product (inline edit, no file upload required)
      parameters:
        - name: itemCode
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mrp, reason]
              properties:
                mrp:
                  type: number
                  description: New MRP value (must be positive)
                effectiveDate:
                  type: string
                  description: "Effective date (YYYY-MM-DD). Defaults to today."
                reason:
                  type: string
                  minLength: 1
                  description: Reviewer-supplied reason for this manual MRP correction
      responses:
        "200":
          description: MRP updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, itemCode, mrp, effectiveDate]
                properties:
                  ok:
                    type: boolean
                  itemCode:
                    type: string
                  mrp:
                    type: number
                  effectiveDate:
                    type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/filters:
    get:
      operationId: getCatalogFilters
      tags: [catalog]
      summary: Available divisions and categories for filtering
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFilters"
  /catalog/data-health:
    get:
      operationId: getCatalogDataHealth
      tags: [catalog]
      summary: Data health report (conflicts, missing prices, duplicate sources)
      responses:
        "200":
          description: Data health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDataHealth"
  /catalog/variant-provenance/reconcile:
    post:
      operationId: reconcileSanitarywareVariantProvenance
      tags: [catalog]
      summary: Attach the exact audited January colour rows to their known-source period batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  example: ATTACH 148 JANUARY COLOUR ROWS
      responses:
        "200":
          description: Known-source rows attached, or already attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanitarywareVariantReconciliationResult"
        "400":
          description: Confirmation phrase missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Audited row or payload signature no longer matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/reset:
    post:
      operationId: resetCatalog
      tags: [catalog]
      summary: Reset the product catalog to the original clean import
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /catalog/comparison:
    get:
      operationId: getComparison
      tags: [comparison]
      summary: Competitor price points joined to Prayag's current MRP with live diff%
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: matchStatus
          in: query
          required: false
          schema:
            type: string
        - name: confidence
          in: query
          required: false
          description: Filter by match confidence tier (High, Medium, Low).
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only rows where Prayag is more expensive than the competitor.
          schema:
            type: boolean
        - name: ambiguousOnly
          in: query
          required: false
          description: Only rows whose unit basis is ambiguous (flagged for review).
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonList"
  /catalog/comparison/summary:
    get:
      operationId: getComparisonSummary
      tags: [comparison]
      summary: Competitive-share KPI and per-category Prayag win-rate
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Comparison summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonSummary"
  /catalog/comparison/by-product:
    get:
      operationId: getComparisonByProduct
      tags: [comparison]
      summary: Per-Prayag-SKU side-by-side comparison across all competitor brands
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only SKUs where Prayag is pricier than the cheapest rival.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Per-product comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductComparisonList"
  /catalog/comparison/filters:
    get:
      operationId: getComparisonFilters
      tags: [comparison]
      summary: Available competitors, categories, match statuses, and price periods for filtering
      parameters:
        - name: competitor
          in: query
          required: false
          description: When set, scopes the returned periods to rows for that competitor only.
          schema:
            type: string
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonFilters"
  /catalog/comparison/matrix:
    get:
      operationId: getComparisonMatrix
      tags: [comparison]
      summary: Side-by-side matrix — one row per Prayag product with each competitor's price and live diff%
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: expensiveOnly
          in: query
          required: false
          description: Only rows where Prayag is more expensive than at least one competitor.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonMatrix"
  /catalog/mapping-review:
    get:
      operationId: getMappingReview
      tags: [comparison]
      summary: Competitor rows needing manual mapping (unmatched / ambiguous)
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: confidence
          in: query
          required: false
          description: Filter by match confidence tier (Low, etc.).
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Filter to a single price-period (effective date, YYYY-MM-DD).
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Mapping review rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingReviewList"
  /catalog/competitor-prices/bulk:
    patch:
      operationId: bulkUpdateCompetitorMappings
      tags: [comparison]
      summary: Apply mapping updates to many competitor rows at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMappingUpdate"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMappingResult"
  /catalog/mapping-review/auto-accept:
    post:
      operationId: autoAcceptMappings
      tags: [comparison]
      summary: Auto-accept top suggestions at/above a confidence tier across the current filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoAcceptRequest"
      responses:
        "200":
          description: Auto-accept result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAcceptResult"
  /catalog/mapping-review/auto-accept-preview:
    get:
      operationId: getAutoAcceptPreview
      tags: [comparison]
      summary: Count how many rows each confidence threshold would auto-accept for the current filter
      parameters:
        - name: competitor
          in: query
          required: false
          schema:
            type: string
        - name: confidence
          in: query
          required: false
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Scope the preview to a single price-period (effective date, YYYY-MM-DD).
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Per-threshold acceptance counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAcceptPreview"
  /catalog/mapping-review/accept-batches:
    get:
      operationId: getAcceptBatches
      tags: [comparison]
      summary: Recent bulk/auto accept batches that can still be sent back to review
      responses:
        "200":
          description: Recent accept batches (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptBatchList"
    post:
      operationId: recordAcceptBatch
      tags: [comparison]
      summary: Record an accepted batch so it can be reverted later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAcceptBatch"
      responses:
        "200":
          description: Recorded batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptBatch"
  /catalog/mapping-review/accept-batches/{id}:
    delete:
      operationId: deleteAcceptBatch
      tags: [comparison]
      summary: Forget a recorded accept batch (e.g. after it was reverted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptBatchDeleteResult"
  /catalog/competitor-prices/{id}:
    patch:
      operationId: updateCompetitorMapping
      tags: [comparison]
      summary: Assign or correct a competitor row's matched Prayag code and status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorMappingUpdate"
      responses:
        "200":
          description: Updated comparison row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonRow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
