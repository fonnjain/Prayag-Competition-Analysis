        perMetre:
          type: ["number", "null"]
          description: Competitor price reduced to ₹/metre, when length-normalizable.
        diffPct:
          type: ["number", "null"]
          description: >-
            Diff% on the SKU's comparison basis (per metre when the Prayag SKU is
            length-based, else raw); null when this cell's unit is ambiguous.
        isCheapest:
          type: boolean
        unitAmbiguous:
          type: boolean
          description: True when this cell's unit basis cannot be resolved.
